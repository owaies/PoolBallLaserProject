name: Roboflow Service Tests

on:
  push:
    paths:
      - "backend/app/services/roboflow_service.py"
      - "backend/app/core/config.py"
      - "backend/tests/test_settings_security.py"
      - "backend/tests/test_roboflow_service.py"
      - ".github/workflows/roboflow-service-tests.yml"
  pull_request:
    paths:
      - "backend/app/services/roboflow_service.py"
      - "backend/tests/test_roboflow_service.py"
      - ".github/workflows/roboflow-service-tests.yml"

permissions:
  contents: read

jobs:
  roboflow-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy opencv-python-headless Pillow python-dotenv pydantic-settings

      - name: Run Roboflow service tests
        run: python -m pytest backend/tests/test_roboflow_service.py backend/tests/test_settings_security.py -q
